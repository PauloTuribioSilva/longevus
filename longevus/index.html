<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f5c842">
	<title>Longevus | Cuidado em conjunto</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--purple: #49256e;
			--purple-dark: #32164f;
			--purple-soft: #f1eaf8;
			--yellow: #f5c842;
			--yellow-pale: #fff6d7;
			--ink: #272331;
			--muted: #827d8a;
			--line: #ece9ef;
			--paper: #fff;
			--canvas: #f8f7f9;
			--green: #3b7857;
			--red: #b64255;
			font-family: "DM Sans", sans-serif;
			color: var(--ink);
			background: var(--canvas);
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}

		* { box-sizing: border-box; }
		body { margin: 0; min-width: 320px; min-height: 100vh; }
		button, input, select, textarea { font: inherit; }
		button { cursor: pointer; }
		button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
			outline: 3px solid #a879d2;
			outline-offset: 2px;
		}

		.app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
		.sidebar {
			min-height: 100vh;
			padding: 28px 18px 22px;
			background: var(--purple-dark);
			color: #fff;
			display: flex;
			flex-direction: column;
		}
		.brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; color: #fff; text-decoration: none; }
		.brand-mark {
			display: grid;
			place-items: center;
			width: 38px;
			height: 38px;
			border-radius: 12px;
			background: var(--yellow);
			color: var(--purple-dark);
			font: 800 21px "Manrope", sans-serif;
		}
		.brand-name { font: 800 20px "Manrope", sans-serif; letter-spacing: 0; }
		.brand-caption { display: block; margin-top: 1px; color: #c7bad5; font-size: 11px; font-weight: 500; }
		.nav-label { margin: 42px 10px 12px; color: #b8a9c7; font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
		.nav-list { display: grid; gap: 6px; }
		.nav-button {
			border: 0;
			border-radius: 9px;
			padding: 12px 12px;
			background: transparent;
			color: #e4dbea;
			text-align: left;
			font-size: 14px;
			font-weight: 600;
			transition: background .18s ease, color .18s ease;
		}
		.nav-button:hover { background: #49266a; color: #fff; }
		.nav-button[aria-current="page"] { background: var(--yellow); color: var(--purple-dark); }
		.sidebar-note { margin-top: auto; padding: 16px 14px; border: 1px solid #5a3c73; border-radius: 10px; color: #d4c9df; font-size: 12px; line-height: 1.55; }
		.sidebar-note strong { display: block; margin-bottom: 5px; color: #fff; font-size: 13px; }

		.workspace { min-width: 0; }
		.topbar {
			min-height: 76px;
			padding: 0 36px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 18px;
			background: var(--paper);
			border-bottom: 1px solid var(--line);
		}
		.topbar-title { color: var(--muted); font-size: 13px; }
		.topbar-profile { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; font-weight: 700; }
		.role-control { display: grid; gap: 3px; color: var(--muted); font-size: 10px; font-weight: 700; }
		.role-control select { max-width: 210px; min-height: 32px; padding: 4px 28px 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--purple-dark); font-size: 11px; font-weight: 700; }
		.avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--purple-soft); color: var(--purple); font-weight: 800; }
		main { width: min(1390px, 100%); margin: 0 auto; padding: 32px 36px 48px; }
		.page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
		.eyebrow { margin: 0 0 7px; color: var(--purple); font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; }
		h1, h2, h3, p { margin-top: 0; }
		h1 { margin-bottom: 5px; font: 800 27px "Manrope", sans-serif; letter-spacing: 0; }
		.page-subtitle { margin: 0; color: var(--muted); font-size: 14px; }
		.primary-button, .secondary-button, .quiet-button, .danger-button {
			min-height: 40px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			border-radius: 8px;
			padding: 0 14px;
			font-weight: 700;
			font-size: 13px;
			transition: transform .15s ease, background .15s ease;
		}
		.primary-button { border: 1px solid var(--purple); background: var(--purple); color: #fff; }
		.primary-button:hover { background: var(--purple-dark); transform: translateY(-1px); }
		.secondary-button { border: 1px solid #d9c8e9; background: var(--purple-soft); color: var(--purple); }
		.secondary-button:hover { background: #e8dcf2; }
		.quiet-button { min-height: 34px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
		.quiet-button:hover { background: var(--canvas); }
		.danger-button { min-height: 32px; border: 0; background: #fff0f1; color: var(--red); font-size: 12px; }
		.danger-button:hover { background: #f9dfe2; }
		.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 21px; }
		.metric { min-height: 92px; padding: 17px 18px; background: #fff; border: 1px solid var(--line); border-radius: 9px; }
		.metric-label { color: var(--muted); font-size: 12px; font-weight: 600; }
		.metric-value { margin-top: 7px; font: 800 25px "Manrope", sans-serif; color: var(--purple-dark); }
		.calendar-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(265px, .85fr); gap: 18px; align-items: start; }
		.panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; }
		.panel-header { min-height: 65px; padding: 15px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
		.panel-header h2 { margin: 0; font: 800 15px "Manrope", sans-serif; }
		.month-controls { display: flex; align-items: center; gap: 8px; }
		.month-label { min-width: 130px; text-align: center; font: 700 13px "Manrope", sans-serif; text-transform: capitalize; }
		.month-arrow { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--purple); font-size: 17px; }
		.month-arrow:hover { background: var(--purple-soft); }
		.calendar-scroll { overflow-x: auto; }
		.calendar-grid { min-width: 560px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
		.weekday { padding: 12px 4px 9px; color: var(--muted); text-align: center; font-size: 10px; font-weight: 800; text-transform: uppercase; }
		.day-cell { position: relative; min-height: 88px; padding: 7px; border-top: 1px solid var(--line); border-right: 1px solid var(--line); }
		.day-cell:nth-child(7n) { border-right: 0; }
		.day-number { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; color: #56515e; font-size: 11px; }
		.day-cell.outside .day-number { color: #b8b3bd; }
		.day-cell.today .day-number { background: var(--yellow); color: var(--purple-dark); font-weight: 800; }
		.day-events { display: grid; gap: 3px; margin-top: 3px; }
		.day-event { overflow: hidden; border-radius: 4px; padding: 4px 5px; background: var(--purple-soft); color: var(--purple); font-size: 9px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
		.day-event:nth-child(3n + 2) { background: var(--yellow-pale); color: #765900; }
		.day-event:nth-child(3n) { background: #eaf3ec; color: var(--green); }
		.agenda-panel { overflow: hidden; }
		.agenda-list { padding: 4px 17px 12px; }
		.agenda-item { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--line); }
		.agenda-item:last-child { border-bottom: 0; }
		.agenda-date { align-self: start; padding: 7px 3px; border-radius: 7px; background: var(--yellow-pale); color: #725500; text-align: center; }
		.agenda-date strong { display: block; font: 800 17px "Manrope", sans-serif; }
		.agenda-date span { display: block; margin-top: 1px; font-size: 9px; font-weight: 700; text-transform: uppercase; }
		.agenda-title { margin: 1px 0 4px; font-size: 13px; font-weight: 800; }
		.agenda-meta { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
		.agenda-tools { margin-top: 7px; }
		.empty-state { padding: 29px 12px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.6; }
		.view-section { animation: arrive .22s ease both; }
		@keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
		.list-panel { overflow: hidden; }
		.list-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(110px, .75fr) minmax(110px, .8fr) auto; gap: 12px; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); }
		.list-row:last-child { border-bottom: 0; }
		.item-name { font-size: 13px; font-weight: 800; }
		.item-detail { margin-top: 4px; color: var(--muted); font-size: 11px; }
		.item-tag { display: inline-block; border-radius: 99px; padding: 5px 8px; background: var(--yellow-pale); color: #715500; font-size: 10px; font-weight: 700; }
		.team-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 18px; align-items: start; }
		.profile-content { padding: 18px; }
		.profile-name { margin: 2px 0 6px; font: 800 20px "Manrope", sans-serif; }
		.profile-help { margin-bottom: 16px; color: var(--muted); font-size: 12px; line-height: 1.5; }
		.caregiver-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 17px; border-bottom: 1px solid var(--line); }
		.caregiver-row:last-child { border-bottom: 0; }
		.caregiver-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; }
		.caregiver-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--purple-soft); color: var(--purple); font-size: 11px; font-weight: 800; }
		.profile-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 16px; align-items: start; }
		.profile-stack { display: grid; gap: 16px; min-width: 0; }
		.profile-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 18px 0 0; }
		.profile-facts div { min-width: 0; }
		.profile-facts dt { margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
		.profile-facts dd { margin: 0; overflow-wrap: anywhere; font-size: 13px; line-height: 1.45; }
		.medicine-card, .record-row { min-width: 0; padding: 14px 17px; border-bottom: 1px solid var(--line); }
		.medicine-card:last-child, .record-row:last-child { border-bottom: 0; }
		.record-main { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
		.record-copy { min-width: 0; overflow-wrap: anywhere; }
		.record-title { margin: 0 0 4px; font-size: 13px; font-weight: 800; }
		.record-meta { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; overflow-wrap: anywhere; }
		.record-actions { display: flex; flex-wrap: wrap; gap: 6px; }
		.role-note { align-self: center; color: var(--muted); font-size: 11px; }
		.alert-row { border-left: 3px solid var(--yellow); }
		.alert-row[data-priority="alta"] { border-left-color: var(--red); }
		.alert-row[data-priority="baixa"] { border-left-color: var(--green); }
		.notice-box { padding: 13px 15px; border-radius: 8px; background: var(--yellow-pale); color: #6d5507; font-size: 12px; line-height: 1.5; }
		.medicine-form-note { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
		[hidden] { display: none !important; }
		.modal {
			width: min(490px, calc(100% - 28px));
			max-height: min(88vh, 760px);
			padding: 0;
			overflow: auto;
			border: 0;
			border-radius: 12px;
			color: var(--ink);
			box-shadow: 0 24px 80px #21132e35;
		}
		.modal::backdrop { background: #20152c80; backdrop-filter: blur(2px); }
		.modal-header { padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
		.modal-header h2 { margin: 0 0 4px; font: 800 18px "Manrope", sans-serif; }
		.modal-header p { margin: 0; color: var(--muted); font-size: 12px; }
		.modal-form { padding: 18px 22px 22px; }
		.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
		.field { display: grid; gap: 6px; min-width: 0; }
		.field.full { grid-column: 1 / -1; }
		.field label { color: #57515f; font-size: 11px; font-weight: 700; }
		.field input, .field select, .field textarea { width: 100%; min-height: 40px; padding: 9px 10px; border: 1px solid #ded9e3; border-radius: 7px; background: #fff; color: var(--ink); font-size: 13px; }
		.field textarea { min-height: 75px; resize: vertical; }
		.form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 19px; }
		.toast { position: fixed; right: 22px; bottom: 22px; z-index: 5; max-width: min(360px, calc(100% - 32px)); padding: 12px 16px; border-radius: 8px; background: var(--purple-dark); color: #fff; font-size: 13px; box-shadow: 0 8px 25px #21132e26; animation: arrive .2s ease both; }
		.toast[hidden] { display: none; }

		@media (max-width: 1050px) {
			.app-shell { grid-template-columns: 205px minmax(0, 1fr); }
			.topbar { padding: 0 24px; }
			main { padding: 27px 24px 40px; }
			.calendar-layout { grid-template-columns: minmax(0, 1fr); }
			.profile-grid { grid-template-columns: 1fr; }
		}
		@media (max-width: 760px) {
			.app-shell { display: block; }
			.sidebar { min-height: auto; padding: 12px 15px; }
			.brand { padding: 0 2px; }
			.brand-mark { width: 34px; height: 34px; }
			.nav-label, .sidebar-note { display: none; }
			.nav-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; margin-top: 11px; overflow: visible; }
			.nav-button { min-width: 0; min-height: 40px; padding: 7px 5px; text-align: center; font-size: 11px; line-height: 1.2; white-space: normal; }
			.topbar { min-height: 58px; padding: 8px 16px; }
			.topbar-title { font-size: 11px; }
			.role-control select { max-width: 170px; }
			.avatar { width: 29px; height: 29px; }
			main { padding: 23px 16px 34px; }
			.page-heading { align-items: stretch; flex-direction: column; gap: 12px; margin-bottom: 19px; }
			.page-heading .primary-button { width: 100%; }
			h1 { font-size: 23px; overflow-wrap: anywhere; }
			.metrics { gap: 8px; }
			.metric { min-width: 0; min-height: 78px; padding: 11px 9px; }
			.metric-label { font-size: 10px; line-height: 1.35; overflow-wrap: anywhere; }
			.metric-value { font-size: 21px; }
			.panel-header { min-width: 0; padding: 12px; }
			.panel-header h2 { overflow-wrap: anywhere; }
			.calendar-grid { min-width: 0; }
			.day-cell { min-width: 0; min-height: 60px; padding: 4px 2px; }
			.day-number { width: 22px; height: 22px; margin: 0 auto; font-size: 10px; }
			.weekday { padding: 9px 1px 7px; font-size: 9px; }
			.day-events { display: flex; justify-content: center; flex-wrap: wrap; gap: 3px; }
			.day-event { width: 5px; height: 5px; padding: 0; border-radius: 50%; font-size: 0; }
			.agenda-panel { display: block; }
			.agenda-list { display: block; padding: 0 13px 8px; }
			.agenda-item { grid-template-columns: 42px minmax(0, 1fr); gap: 9px; }
			.team-layout { grid-template-columns: minmax(0, 1fr); }
			.list-row { grid-template-columns: minmax(0, 1fr); gap: 9px; padding: 13px; }
			.list-row .item-extra { grid-column: auto; }
			.list-row .danger-button { grid-column: auto; grid-row: auto; justify-self: start; }
			.record-main { flex-direction: column; }
			.record-actions { width: 100%; }
			.record-actions button { flex: 1 1 auto; }
			.profile-facts { grid-template-columns: minmax(0, 1fr); }
			.form-grid { grid-template-columns: minmax(0, 1fr); }
			.field.full { grid-column: auto; }
			.form-actions { flex-wrap: wrap; }
			.form-actions button { flex: 1 1 120px; }
		}
		@media (max-width: 390px) {
			.topbar { align-items: flex-start; flex-direction: column; gap: 7px; }
			.topbar-profile { width: 100%; }
			.role-control { margin-left: auto; }
			.role-control select { max-width: 150px; }
			main { padding-right: 12px; padding-left: 12px; }
			.metrics { grid-template-columns: minmax(0, 1fr); }
			.metric { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
			.metric-value { margin-top: 0; }
		}
		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<div class="app-shell">
		<aside class="sidebar">
			<a class="brand" href="#inicio" aria-label="Longevus, início">
				<span class="brand-mark">L</span>
				<span><span class="brand-name">longevus</span><span class="brand-caption">cuidado em conjunto</span></span>
			</a>
			<p class="nav-label">Organização</p>
			<nav class="nav-list" aria-label="Navegação principal">
				<button class="nav-button" type="button" data-view="calendar" aria-current="page">Visão geral</button>
				<button class="nav-button" type="button" data-view="profile">Perfil do idoso</button>
				<button class="nav-button" type="button" data-view="medicines">Medicamentos</button>
				<button class="nav-button" type="button" data-view="agenda">Agenda</button>
				<button class="nav-button" type="button" data-view="documents">Exames e laudos</button>
				<button class="nav-button" type="button" data-view="alerts">Avisos</button>
				<button class="nav-button" type="button" data-view="team">Equipe</button>
			</nav>
			<div class="sidebar-note"><strong>Cuidado compartilhado</strong>Uma rotina mais organizada para quem cuida e para quem recebe cuidado.</div>
		</aside>

		<div class="workspace">
			<header class="topbar">
				<span class="topbar-title" id="today-label"></span>
				<div class="topbar-profile"><span class="avatar" id="profile-avatar">L</span><span id="profile-label">Minha família</span><label class="role-control">Acessar como<select id="active-role" aria-label="Alternar perfil de acesso"><option value="admin">Administrador da família</option><option value="caregiver">Cuidador (consulta)</option></select></label></div>
			</header>
			<main id="main-content"></main>
		</div>
	</div>

	<dialog class="modal" id="form-dialog" aria-labelledby="dialog-title">
		<div class="modal-header"><h2 id="dialog-title"></h2><p id="dialog-subtitle"></p></div>
		<form class="modal-form" id="entry-form"></form>
	</dialog>
	<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

	<script>
		(() => {
			const STORAGE_KEY = "longevus-data-v1";
			const emptyData = { elder: "", elderProfile: {}, caregivers: [], medicines: [], appointments: [], documents: [], alerts: [] };
			let data = loadData();
			let currentView = "calendar";
			let activeRole = "admin";
			let shownMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
			let toastTimer;

			const main = document.querySelector("#main-content");
			const dialog = document.querySelector("#form-dialog");
			const form = document.querySelector("#entry-form");
			const roleSelect = document.querySelector("#active-role");
			const weekdayNames = ["seg", "ter", "qua", "qui", "sex", "sáb", "dom"];
			const monthFormatter = new Intl.DateTimeFormat("pt-BR", { month: "long", year: "numeric" });
			const longDateFormatter = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
			const collections = { appointment: "appointments", medicine: "medicines", caregiver: "caregivers", document: "documents", alert: "alerts" };

			function loadData() {
				try {
					const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
					if (!saved || typeof saved !== "object") return { ...emptyData };
					return {
						...emptyData,
						...saved,
						elderProfile: { ...emptyData.elderProfile, ...(saved.elderProfile || {}) },
						caregivers: Array.isArray(saved.caregivers) ? saved.caregivers : [],
						medicines: Array.isArray(saved.medicines) ? saved.medicines : [],
						appointments: Array.isArray(saved.appointments) ? saved.appointments : [],
						documents: Array.isArray(saved.documents) ? saved.documents : [],
						alerts: Array.isArray(saved.alerts) ? saved.alerts : []
					};
				} catch {
					return { ...emptyData };
				}
			}

			function saveData() {
				try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
				catch { showToast("Não foi possível salvar neste navegador."); }
			}

			function escapeHtml(value) {
				return String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
			}

			function makeId() { return window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
			function isAdmin() { return activeRole === "admin"; }
			function localDateString(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`; }
			function parseDate(dateString) { const [year, month, day] = dateString.split("-").map(Number); return new Date(year, month - 1, day); }
			function formatDate(dateString) { return dateString ? new Intl.DateTimeFormat("pt-BR", { day: "numeric", month: "short", year: "numeric" }).format(parseDate(dateString)).replace(" de ", " ").replace(".", "") : "Data não informada"; }

			function showToast(message) {
				const toast = document.querySelector("#toast");
				toast.textContent = message;
				toast.hidden = false;
				clearTimeout(toastTimer);
				toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
			}

			function updateHeader() {
				const today = new Date();
				document.querySelector("#today-label").textContent = longDateFormatter.format(today);
				document.querySelector("#profile-label").textContent = data.elder || "Perfil da família";
				document.querySelector("#profile-avatar").textContent = data.elder ? data.elder.trim().charAt(0).toLocaleUpperCase("pt-BR") : "L";
				roleSelect.value = activeRole;
				document.querySelectorAll(".nav-button").forEach((button) => {
					if (button.dataset.view === currentView) button.setAttribute("aria-current", "page");
					else button.removeAttribute("aria-current");
				});
			}

			function render() {
				updateHeader();
				const views = { calendar: renderCalendar, profile: renderProfile, medicines: renderMedicines, agenda: renderAgendaPage, documents: renderDocuments, alerts: renderAlerts, team: renderTeam };
				(views[currentView] || renderCalendar)();
			}

			function heading(eyebrow, title, subtitle, actionLabel, actionType) {
				const action = isAdmin() ? `<button class="primary-button" type="button" data-action="${actionType}">+ ${actionLabel}</button>` : `<span class="role-note">Modo de consulta</span>`;
				return `<div class="page-heading"><div><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div>${action}</div>`;
			}

			function upcomingAppointments(limit = 6) {
				return data.appointments.filter((item) => item.date >= localDateString(new Date())).sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`)).slice(0, limit);
			}

			function renderCalendar() {
				const year = shownMonth.getFullYear();
				const month = shownMonth.getMonth();
				const monthAppointments = data.appointments.filter((item) => { const date = parseDate(item.date); return date.getFullYear() === year && date.getMonth() === month; });
				main.innerHTML = `<section class="view-section">${heading("Rotina de cuidado", "Visão geral", "A rotina e os compromissos da família em um só lugar.", "Adicionar consulta", "appointment")}<div class="metrics"><div class="metric"><div class="metric-label">Consultas neste mês</div><div class="metric-value">${monthAppointments.length}</div></div><div class="metric"><div class="metric-label">Medicamentos</div><div class="metric-value">${data.medicines.length}</div></div><div class="metric"><div class="metric-label">Avisos ativos</div><div class="metric-value">${data.alerts.length}</div></div></div><div class="calendar-layout"><section class="panel" aria-label="Calendário mensal"><div class="panel-header"><h2>Calendário compartilhado</h2><div class="month-controls"><button class="month-arrow" type="button" data-action="previous-month" aria-label="Mês anterior">‹</button><span class="month-label">${escapeHtml(monthFormatter.format(shownMonth))}</span><button class="month-arrow" type="button" data-action="next-month" aria-label="Próximo mês">›</button></div></div>${renderMonthGrid(year, month, monthAppointments)}</section><section class="panel agenda-panel"><div class="panel-header"><h2>Próximas consultas</h2><button class="quiet-button" type="button" data-view-link="agenda">Ver agenda</button></div><div class="agenda-list">${renderAgendaItems(upcomingAppointments(4))}</div></section></div></section>`;
			}

			function renderMonthGrid(year, month, appointments) {
				const firstDay = new Date(year, month, 1);
				const gridStart = new Date(year, month, 1 - ((firstDay.getDay() + 6) % 7));
				const todayString = localDateString(new Date());
				let cells = weekdayNames.map((day) => `<div class="weekday">${day}</div>`).join("");
				for (let index = 0; index < 42; index++) {
					const date = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + index);
					const dateString = localDateString(date);
					const events = appointments.filter((item) => item.date === dateString).sort((a, b) => a.time.localeCompare(b.time));
					const eventMarkup = events.slice(0, 3).map((item) => `<span class="day-event" aria-label="${escapeHtml(item.time)} ${escapeHtml(item.title)}" title="${escapeHtml(item.time)} · ${escapeHtml(item.title)}"></span>`).join("");
					const classes = ["day-cell", date.getMonth() !== month ? "outside" : "", dateString === todayString ? "today" : ""].filter(Boolean).join(" ");
					cells += `<div class="${classes}"><span class="day-number">${date.getDate()}</span><div class="day-events">${eventMarkup}</div></div>`;
				}
				return `<div class="calendar-scroll"><div class="calendar-grid">${cells}</div></div>`;
			}

			function recordActions(type, id) {
				return isAdmin() ? `<div class="record-actions"><button class="quiet-button" type="button" data-action="edit" data-type="${type}" data-id="${escapeHtml(id)}">Editar</button><button class="danger-button" type="button" data-action="delete" data-type="${type}" data-id="${escapeHtml(id)}">Remover</button></div>` : "";
			}

			function renderAgendaItems(appointments) {
				if (!appointments.length) return `<div class="empty-state">Nenhuma consulta cadastrada.</div>`;
				return appointments.map((item) => {
					const date = parseDate(item.date);
					const caregiver = data.caregivers.find((person) => person.id === item.caregiverId)?.name;
					return `<article class="agenda-item"><div class="agenda-date"><strong>${date.getDate()}</strong><span>${escapeHtml(new Intl.DateTimeFormat("pt-BR", { month: "short" }).format(date).replace(".", ""))}</span></div><div class="record-copy"><p class="agenda-title">${escapeHtml(item.title)}</p><p class="agenda-meta">${escapeHtml(item.time)}${item.location ? ` · ${escapeHtml(item.location)}` : ""}${caregiver ? `<br>Responsável: ${escapeHtml(caregiver)}` : ""}${item.notes ? `<br>${escapeHtml(item.notes)}` : ""}</p>${recordActions("appointment", item.id)}</div></article>`;
				}).join("");
			}

			function medicineItems(type) {
				return data.medicines.filter((item) => (item.type || "scheduled") === type).map((item) => {
					const caregiver = data.caregivers.find((person) => person.id === item.caregiverId)?.name;
					const detail = type === "occasional" ? `<p class="record-meta"><strong>Para:</strong> ${escapeHtml(item.purpose || "Finalidade não informada")}${item.instructions ? `<br><strong>Orientação:</strong> ${escapeHtml(item.instructions)}` : ""}</p>` : `<p class="record-meta"><strong>Horários:</strong> ${escapeHtml(item.times || "Não informados")}${caregiver ? `<br><strong>Responsável:</strong> ${escapeHtml(caregiver)}` : ""}</p>`;
					return `<article class="medicine-card"><div class="record-main"><div class="record-copy"><p class="record-title">${escapeHtml(item.name)}${item.dosage ? ` · ${escapeHtml(item.dosage)}` : ""}</p>${detail}</div>${recordActions("medicine", item.id)}</div></article>`;
				}).join("") || `<div class="empty-state">Nenhum medicamento ${type === "scheduled" ? "programado" : "ocasional"} cadastrado.</div>`;
			}

			function renderMedicines() {
				main.innerHTML = `<section class="view-section">${heading("Rotina de cuidado", "Medicamentos", "Horários programados e medicamentos de uso ocasional.", "Cadastrar medicamento", "medicine")}<p class="notice-box">Use as orientações prescritas pelos profissionais de saúde. O Longevus apenas organiza as informações cadastradas pela família.</p><div class="profile-stack" style="margin-top:16px"><section class="panel"><div class="panel-header"><h2>Uso programado</h2><span class="item-detail">Horários e responsável</span></div>${medicineItems("scheduled")}</section><section class="panel"><div class="panel-header"><h2>Uso ocasional</h2><span class="item-detail">Finalidade e orientação</span></div>${medicineItems("occasional")}</section></div></section>`;
			}

			function renderProfile() {
				const profile = data.elderProfile;
				const upcoming = upcomingAppointments(3);
				const documents = data.documents.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 3);
				const alerts = data.alerts.slice(0, 3);
				main.innerHTML = `<section class="view-section">${heading("Perfil e rotina", escapeHtml(data.elder || "Perfil do idoso"), "Informações importantes para toda a rede de cuidado.", "Editar perfil", "profile")}<div class="profile-grid"><div class="profile-stack"><section class="panel"><div class="panel-header"><h2>Informações de saúde</h2><span class="item-detail">Acesso compartilhado</span></div><div class="profile-content"><dl class="profile-facts"><div><dt>Data de nascimento</dt><dd>${profile.birthDate ? escapeHtml(formatDate(profile.birthDate)) : "Não informada"}</dd></div><div><dt>Tipo sanguíneo</dt><dd>${escapeHtml(profile.bloodType || "Não informado")}</dd></div><div><dt>Alergias</dt><dd>${escapeHtml(profile.allergies || "Nenhuma informada")}</dd></div><div><dt>Condições importantes</dt><dd>${escapeHtml(profile.conditions || "Não informadas")}</dd></div><div><dt>Contato de emergência</dt><dd>${escapeHtml(profile.emergencyContact || "Não informado")}</dd></div><div><dt>Observações</dt><dd>${escapeHtml(profile.notes || "Nenhuma")}</dd></div></dl></div></section><section class="panel"><div class="panel-header"><h2>Medicamentos programados</h2><button class="quiet-button" type="button" data-view-link="medicines">Ver todos</button></div>${medicineItems("scheduled")}</section><section class="panel"><div class="panel-header"><h2>Medicamentos ocasionais</h2><button class="quiet-button" type="button" data-view-link="medicines">Ver todos</button></div>${medicineItems("occasional")}</section></div><div class="profile-stack"><section class="panel"><div class="panel-header"><h2>Próximas consultas</h2><button class="quiet-button" type="button" data-view-link="agenda">Ver agenda</button></div><div class="agenda-list">${renderAgendaItems(upcoming)}</div></section><section class="panel"><div class="panel-header"><h2>Exames e laudos</h2><button class="quiet-button" type="button" data-view-link="documents">Ver todos</button></div>${documents.length ? documents.map((item) => `<article class="record-row"><p class="record-title">${escapeHtml(item.title)}</p><p class="record-meta">${escapeHtml(item.kind)} · ${escapeHtml(formatDate(item.date))}${item.notes ? `<br>${escapeHtml(item.notes)}` : ""}</p></article>`).join("") : `<div class="empty-state">Nenhum exame ou laudo cadastrado.</div>`}</section><section class="panel"><div class="panel-header"><h2>Avisos</h2><button class="quiet-button" type="button" data-view-link="alerts">Ver todos</button></div>${alerts.length ? alerts.map((item) => `<article class="record-row alert-row" data-priority="${escapeHtml(item.priority)}"><p class="record-title">${escapeHtml(item.title)}</p><p class="record-meta">${escapeHtml(item.priority)}${item.date ? ` · ${escapeHtml(formatDate(item.date))}` : ""}${item.notes ? `<br>${escapeHtml(item.notes)}` : ""}</p></article>`).join("") : `<div class="empty-state">Nenhum aviso cadastrado.</div>`}</section></div></div></section>`;
			}

			function renderAgendaPage() {
				const all = data.appointments.slice().sort((a, b) => `${a.date}T${a.time}`.localeCompare(`${b.date}T${b.time}`));
				main.innerHTML = `<section class="view-section">${heading("Consultas e compromissos", "Agenda", "Consultas organizadas por data e compartilhadas com os cuidadores.", "Adicionar consulta", "appointment")}<section class="panel list-panel"><div class="panel-header"><h2>Todos os compromissos</h2><span class="item-detail">${all.length} cadastrados</span></div>${all.length ? all.map((item) => `<article class="record-row"><div class="record-main"><div class="record-copy"><p class="record-title">${escapeHtml(item.title)}</p><p class="record-meta">${escapeHtml(formatDate(item.date))} · ${escapeHtml(item.time)}${item.location ? ` · ${escapeHtml(item.location)}` : ""}${item.notes ? `<br>${escapeHtml(item.notes)}` : ""}</p></div>${recordActions("appointment", item.id)}</div></article>`).join("") : `<div class="empty-state">Nenhuma consulta cadastrada.</div>`}</section></section>`;
			}

			function renderDocuments() {
				const items = data.documents.slice().sort((a, b) => b.date.localeCompare(a.date));
				main.innerHTML = `<section class="view-section">${heading("Histórico de saúde", "Exames e laudos", "Registre resultados e observações para facilitar o acompanhamento.", "Adicionar registro", "document")}<section class="panel list-panel"><div class="panel-header"><h2>Registros de saúde</h2><span class="item-detail">${items.length} cadastrados</span></div>${items.length ? items.map((item) => `<article class="record-row"><div class="record-main"><div class="record-copy"><p class="record-title">${escapeHtml(item.title)}</p><p class="record-meta">${escapeHtml(item.kind)} · ${escapeHtml(formatDate(item.date))}${item.status ? ` · ${escapeHtml(item.status)}` : ""}${item.notes ? `<br>${escapeHtml(item.notes)}` : ""}</p></div>${recordActions("document", item.id)}</div></article>`).join("") : `<div class="empty-state">Nenhum exame ou laudo cadastrado.</div>`}</section></section>`;
			}

			function renderAlerts() {
				main.innerHTML = `<section class="view-section">${heading("Acompanhamento", "Avisos", "Lembretes e informações importantes para a família.", "Adicionar aviso", "alert")}<section class="panel list-panel"><div class="panel-header"><h2>Avisos do perfil</h2><span class="item-detail">${data.alerts.length} cadastrados</span></div>${data.alerts.length ? data.alerts.map((item) => `<article class="record-row alert-row" data-priority="${escapeHtml(item.priority)}"><div class="record-main"><div class="record-copy"><p class="record-title">${escapeHtml(item.title)}</p><p class="record-meta">Prioridade ${escapeHtml(item.priority)}${item.date ? ` · ${escapeHtml(formatDate(item.date))}` : ""}${item.notes ? `<br>${escapeHtml(item.notes)}` : ""}</p></div>${recordActions("alert", item.id)}</div></article>`).join("") : `<div class="empty-state">Nenhum aviso cadastrado.</div>`}</section></section>`;

			}

			function openForm(type, id = "") {
				if (!isAdmin()) { showToast("Somente o administrador pode alterar os registros."); return; }
				const collection = collections[type];
				const existing = id && collection ? data[collection].find((item) => item.id === id) : null;
				const value = (key, fallback = "") => escapeHtml(existing?.[key] ?? fallback);
				const isEditing = Boolean(existing);
				const configs = {
					profile: { title: "Perfil do idoso", subtitle: "Informações úteis para o cuidado diário.", save: "Salvar perfil", fields: `<div class="form-grid"><div class="field full"><label for="elder">Nome completo</label><input id="elder" name="elder" maxlength="70" value="${escapeHtml(data.elder)}" required></div><div class="field"><label for="birthDate">Data de nascimento</label><input id="birthDate" name="birthDate" type="date" value="${escapeHtml(data.elderProfile.birthDate || "")}"></div><div class="field"><label for="bloodType">Tipo sanguíneo</label><select id="bloodType" name="bloodType"><option value="">Não informado</option>${["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-"].map((option) => `<option ${data.elderProfile.bloodType === option ? "selected" : ""}>${option}</option>`).join("")}</select></div><div class="field full"><label for="allergies">Alergias</label><textarea id="allergies" name="allergies" maxlength="300" placeholder="Alergias conhecidas">${escapeHtml(data.elderProfile.allergies || "")}</textarea></div><div class="field full"><label for="conditions">Condições importantes</label><textarea id="conditions" name="conditions" maxlength="300" placeholder="Informações relevantes para os cuidadores">${escapeHtml(data.elderProfile.conditions || "")}</textarea></div><div class="field full"><label for="emergencyContact">Contato de emergência</label><input id="emergencyContact" name="emergencyContact" maxlength="100" value="${escapeHtml(data.elderProfile.emergencyContact || "")}" placeholder="Nome e telefone"></div><div class="field full"><label for="notes">Observações</label><textarea id="notes" name="notes" maxlength="500">${escapeHtml(data.elderProfile.notes || "")}</textarea></div></div>` },
					appointment: { title: `${isEditing ? "Editar" : "Adicionar"} consulta`, subtitle: "Compartilhe data, horário e detalhes com a família.", save: "Salvar consulta", fields: `<div class="form-grid"><div class="field full"><label for="title">Consulta ou compromisso</label><input id="title" name="title" maxlength="80" value="${value("title")}" placeholder="Ex.: Cardiologista" required></div><div class="field"><label for="date">Data</label><input id="date" name="date" type="date" value="${value("date", localDateString(new Date()))}" required></div><div class="field"><label for="time">Horário</label><input id="time" name="time" type="time" value="${value("time", "09:00")}" required></div><div class="field"><label for="location">Local</label><input id="location" name="location" maxlength="80" value="${value("location")}" placeholder="Clínica ou endereço"></div><div class="field"><label for="caregiverId">Cuidador responsável</label><select id="caregiverId" name="caregiverId">${caregiverOptions(existing?.caregiverId)}</select></div><div class="field full"><label for="notes">Observações</label><textarea id="notes" name="notes" maxlength="300">${value("notes")}</textarea></div></div>` },
					medicine: { title: `${isEditing ? "Editar" : "Cadastrar"} medicamento`, subtitle: "Organize medicamentos sem substituir a orientação profissional.", save: "Salvar medicamento", fields: `<div class="form-grid"><div class="field full"><label for="name">Nome do medicamento</label><input id="name" name="name" maxlength="80" value="${value("name")}" required></div><div class="field full"><label for="type">Tipo de uso</label><select id="type" name="type"><option value="scheduled" ${(existing?.type || "scheduled") === "scheduled" ? "selected" : ""}>Programado</option><option value="occasional" ${existing?.type === "occasional" ? "selected" : ""}>Ocasional (se necessário)</option></select></div><div class="field"><label for="dosage">Dose</label><input id="dosage" name="dosage" maxlength="50" value="${value("dosage")}" placeholder="Ex.: 1 comprimido"></div><div class="field" id="times-field"><label for="times">Horários</label><input id="times" name="times" maxlength="80" value="${value("times")}" placeholder="08:00, 20:00"></div><div class="field full" id="purpose-field"><label for="purpose">Para que serve?</label><input id="purpose" name="purpose" maxlength="120" value="${value("purpose")}" placeholder="Ex.: dor de cabeça"></div><div class="field full" id="instructions-field"><label for="instructions">Orientação cadastrada</label><textarea id="instructions" name="instructions" maxlength="250" placeholder="Registrar a orientação recebida do profissional">${value("instructions")}</textarea></div><div class="field full"><label for="caregiverId">Cuidador responsável</label><select id="caregiverId" name="caregiverId">${caregiverOptions(existing?.caregiverId)}</select></div><p class="medicine-form-note field full">Informe apenas as orientações já recebidas de um profissional de saúde.</p></div>` },
					caregiver: { title: "Adicionar cuidador", subtitle: "Inclua uma pessoa na rede de cuidado.", save: "Adicionar cuidador", fields: `<div class="form-grid"><div class="field full"><label for="name">Nome do cuidador</label><input id="name" name="name" maxlength="70" value="${value("name")}" required></div></div>` },
					document: { title: `${isEditing ? "Editar" : "Adicionar"} exame ou laudo`, subtitle: "Registre data, tipo e observações do documento.", save: "Salvar registro", fields: `<div class="form-grid"><div class="field full"><label for="title">Nome do exame ou laudo</label><input id="title" name="title" maxlength="100" value="${value("title")}" placeholder="Ex.: Hemograma completo" required></div><div class="field"><label for="kind">Tipo</label><select id="kind" name="kind"><option ${value("kind", "Exame") === "Exame" ? "selected" : ""}>Exame</option><option ${value("kind") === "Laudo" ? "selected" : ""}>Laudo</option></select></div><div class="field"><label for="date">Data</label><input id="date" name="date" type="date" value="${value("date", localDateString(new Date()))}" required></div><div class="field full"><label for="status">Resultado ou status</label><input id="status" name="status" maxlength="100" value="${value("status")}" placeholder="Ex.: aguardando resultado"></div><div class="field full"><label for="notes">Observações</label><textarea id="notes" name="notes" maxlength="500">${value("notes")}</textarea></div></div>` },
					alert: { title: `${isEditing ? "Editar" : "Adicionar"} aviso`, subtitle: "Compartilhe um lembrete importante sobre o cuidado.", save: "Salvar aviso", fields: `<div class="form-grid"><div class="field full"><label for="title">Aviso</label><input id="title" name="title" maxlength="100" value="${value("title")}" placeholder="Ex.: Confirmar renovação da receita" required></div><div class="field"><label for="priority">Prioridade</label><select id="priority" name="priority"><option value="alta" ${value("priority", "média") === "alta" ? "selected" : ""}>Alta</option><option value="média" ${value("priority", "média") === "média" ? "selected" : ""}>Média</option><option value="baixa" ${value("priority", "média") === "baixa" ? "selected" : ""}>Baixa</option></select></div><div class="field"><label for="date">Data (opcional)</label><input id="date" name="date" type="date" value="${value("date")}"></div><div class="field full"><label for="notes">Detalhes</label><textarea id="notes" name="notes" maxlength="400">${value("notes")}</textarea></div></div>` }
				};
				const config = configs[type];
				if (!config) return;
				document.querySelector("#dialog-title").textContent = config.title;
				document.querySelector("#dialog-subtitle").textContent = config.subtitle;
				form.innerHTML = `${config.fields}<div class="form-actions"><button class="quiet-button" type="button" data-action="close-dialog">Cancelar</button><button class="primary-button" type="submit">${config.save || "Salvar"}</button></div>`;
				form.dataset.saveAction = type;
				form.dataset.recordId = existing?.id || "";
				if (type === "medicine") syncMedicineFields();
				dialog.showModal();
				form.querySelector("input, select, textarea")?.focus();
			}

			function syncMedicineFields() {
				const occasional = form.querySelector("#type")?.value === "occasional";
				const times = form.querySelector("#times");
				const purpose = form.querySelector("#purpose");
				form.querySelector("#times-field").hidden = occasional;
				form.querySelector("#purpose-field").hidden = !occasional;
				form.querySelector("#instructions-field").hidden = !occasional;
				times.required = !occasional;
				purpose.required = occasional;
			}

			function saveRecord(type, id, values) {
				if (type === "profile") {
					data.elder = values.elder;
					delete values.elder;
					data.elderProfile = values;
					return;
				}
				const collection = collections[type];
				if (!collection) return;
				const index = data[collection].findIndex((item) => item.id === id);
				if (index >= 0) data[collection][index] = { ...data[collection][index], ...values };
				else data[collection].push({ id: makeId(), ...values });
			}

			function deleteRecord(type, id) {
				const collection = collections[type];
				if (!collection) return;
				data[collection] = data[collection].filter((item) => item.id !== id);
				if (type === "caregiver") {
					data.appointments.forEach((item) => { if (item.caregiverId === id) item.caregiverId = ""; });
					data.medicines.forEach((item) => { if (item.caregiverId === id) item.caregiverId = ""; });
				}
			}

			document.querySelector(".nav-list").addEventListener("click", (event) => {
				const button = event.target.closest("[data-view]");
				if (!button) return;
				currentView = button.dataset.view;
				render();
			});

			roleSelect.addEventListener("change", () => {
				activeRole = roleSelect.value;
				showToast(isAdmin() ? "Acesso de administrador da família." : "Modo de consulta do cuidador.");
				render();
			});

			main.addEventListener("click", (event) => {
				const viewLink = event.target.closest("[data-view-link]");
				if (viewLink) { currentView = viewLink.dataset.viewLink; render(); return; }
				const button = event.target.closest("[data-action]");
				if (!button) return;
				const { action, id, type } = button.dataset;
				if (action === "previous-month") { shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth() - 1, 1); render(); return; }
				if (action === "next-month") { shownMonth = new Date(shownMonth.getFullYear(), shownMonth.getMonth() + 1, 1); render(); return; }
				if (!isAdmin()) { showToast("Somente o administrador pode alterar os registros."); return; }
				if (["profile", "appointment", "medicine", "caregiver", "document", "alert"].includes(action)) openForm(action);
				else if (action === "edit") openForm(type, id);
				else if (action === "delete") { deleteRecord(type, id); saveData(); render(); showToast("Registro removido."); }
			});

			form.addEventListener("click", (event) => { if (event.target.closest('[data-action="close-dialog"]')) dialog.close(); });
			form.addEventListener("change", (event) => { if (event.target.id === "type") syncMedicineFields(); });
			form.addEventListener("submit", (event) => {
				event.preventDefault();
				if (!isAdmin()) { dialog.close(); showToast("Somente o administrador pode alterar os registros."); return; }
				if (!form.reportValidity()) return;
				const type = form.dataset.saveAction;
				const raw = Object.fromEntries(new FormData(form).entries());
				let values;
				if (type === "profile") values = Object.fromEntries(Object.entries(raw).map(([key, value]) => [key, value.trim()]));
				else if (type === "appointment") values = { ...raw, title: raw.title.trim(), location: raw.location.trim(), notes: raw.notes.trim() };
				else if (type === "medicine") values = { ...raw, name: raw.name.trim(), dosage: raw.dosage.trim(), times: raw.times.trim(), purpose: raw.purpose.trim(), instructions: raw.instructions.trim(), caregiverId: raw.caregiverId };
				else if (type === "caregiver") values = { name: raw.name.trim() };
				else if (type === "document") values = { ...raw, title: raw.title.trim(), status: raw.status.trim(), notes: raw.notes.trim() };
				else if (type === "alert") values = { ...raw, title: raw.title.trim(), notes: raw.notes.trim() };
				if (!values) return;
				const id = form.dataset.recordId;
				saveRecord(type, id, values);
				saveData();
				dialog.close();
				render();
				showToast("Informações salvas.");
			});

			dialog.addEventListener("click", (event) => { if (event.target === dialog) dialog.close(); });
			render();
		})();
	</script>
</body>
</html>
